<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Inicio de Sesión - Reloj Checador</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="login-container">
    <ion-item>
      <ion-label position="floating">Email</ion-label>
      <ion-input type="email" [(ngModel)]="credentials.email"></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="floating">Contraseña</ion-label>
      <ion-input type="password" [(ngModel)]="credentials.password"></ion-input>
    </ion-item>
    <ion-button expand="block" (click)="login()" class="ion-margin-top">Ingresar</ion-button>
  </div>
</ion-content>
